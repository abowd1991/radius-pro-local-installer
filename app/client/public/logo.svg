<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="45%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="url(#bg)"/>
  <!-- Shine overlay top half -->
  <rect x="3" y="3" width="94" height="47" rx="20" fill="url(#shine)"/>
  <!-- Border -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- ─── Letter R ─── -->
  <!-- Using a clean path for letter R centered slightly left -->
  <!-- Stem -->
  <rect x="22" y="22" width="10" height="56" rx="4" fill="white"/>
  <!-- Top bowl of R -->
  <path d="M 32 22 L 48 22 Q 62 22 62 36 Q 62 50 48 50 L 32 50" 
        fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Leg of R (diagonal going down-right) -->
  <line x1="48" y1="50" x2="64" y2="78" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- ─── RADIUS signal waves (right side) ─── -->
  <!-- Wave 1 - inner -->
  <path d="M 68 40 A 10 10 0 0 1 68 60"
    fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"
    opacity="1" filter="url(#glow)"/>
  <!-- Wave 2 - middle -->
  <path d="M 73 34 A 16 16 0 0 1 73 66"
    fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"
    opacity="0.65"/>
  <!-- Wave 3 - outer -->
  <path d="M 78 28 A 22 22 0 0 1 78 72"
    fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round"
    opacity="0.35"/>

  <!-- Signal dot source -->
  <circle cx="65" cy="50" r="3" fill="#38BDF8" filter="url(#glow)" opacity="0.95"/>
</svg>
